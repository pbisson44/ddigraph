# Schema overrides applied to the XSD-derived data in
# ``ddigraph.schema._generated/``.
#
# Each [[ddi_cdi.node]] entry produces one NodeDefinition. Fields fall
# back to the [ddi_cdi.defaults] block when omitted; ``properties`` is
# the full ordered tuple (defaults are not implicitly prepended).
#
# CDI relationship types are derived from CDI_GENERATED_ASSOCIATIONS by
# converting the association verb to UPPER_SNAKE_CASE (so ``has`` -> ``HAS``,
# ``isStructuredBy`` -> ``IS_STRUCTURED_BY``). Where that default produces an
# ambiguous name -- typically ``HAS`` -- a curated rel_type lives in
# [ddi_cdi.relationship_overrides] keyed by the association tag.

[ddi_cdi.defaults]
id_field = "cdi_id"
properties = ["cdi_id", "name", "label", "description", "urn"]
indexes = ["name"]

[ddi_cdi.relationship_overrides]
CategorySet_has_Category = "HAS_CATEGORY"
ClassificationFamily_uses_ClassificationIndex = "USES_INDEX"
ClassificationSeries_has_StatisticalClassification = "HAS_STATISTICAL_CLASSIFICATION"
CodeList_has_Code = "HAS_CODE"
ConceptSystemCorrespondence_has_ConceptMap = "HAS_CONCEPT_MAP"
ConceptSystem_has_Concept = "HAS_CONCEPT"
DataStore_has_LogicalRecord = "HAS_LOGICAL_RECORD"
DataStructure_has_DataStructureComponent = "HAS_COMPONENT"
PhysicalDataSet_has_PhysicalRecordSegment = "HAS_PHYSICAL_RECORD_SEGMENT"
StatisticalClassification_has_ClassificationItem = "HAS_CLASSIFICATION_ITEM"

[[ddi_cdi.node]]
label = "CDIConcept"
indexes = ["name", "label"]


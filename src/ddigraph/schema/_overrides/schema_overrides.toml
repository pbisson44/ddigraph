# DDI-L relationship overrides. Every *Reference element name in the XSDs
# emits a runtime relationship; without an override the rel_type defaults
# to ``<tag>.removesuffix("Reference").upper()`` (e.g. ``ArchiveReference``
# -> ``ARCHIVE``). The 64 curated names below use semantic prefixes
# (USES_*, IN_*, HAS_*, REFERENCES_*) that survive the wire-in.

[ddi_l.relationship_overrides]
AssignedVariableReference = "ASSIGNS_VARIABLE"
BasedOnReference = "BASED_ON"
CategoryGroupReference = "IN_CATEGORY_GROUP"
CategoryReference = "HAS_CATEGORY"
CategorySchemeReference = "USES_CATEGORY_SCHEME"
ClassificationFamilyReference = "IN_CLASSIFICATION_FAMILY"
CodeListReference = "USES_CODELIST"
CodeListSchemeReference = "IN_CODELIST_SCHEME"
ConceptReference = "USES_CONCEPT"
ConceptSchemeReference = "IN_CONCEPT_SCHEME"
ConceptualVariableReference = "USES_CONCEPTUAL_VARIABLE"
ConceptualVariableSchemeReference = "IN_CONCEPTUAL_VARIABLE_SCHEME"
ControlConstructReference = "HAS_CONSTRUCT"
ControlConstructSchemeReference = "IN_CONTROL_CONSTRUCT_SCHEME"
DataCollectionReference = "HAS_DATA_COLLECTION"
DataRelationshipReference = "HAS_DATA_RELATIONSHIP"
DefiningConceptReference = "DEFINED_BY_CONCEPT"
DevelopmentActivityReference = "USES_DEVELOPMENT_ACTIVITY"
DevelopmentActivitySchemeReference = "IN_DEVELOPMENT_ACTIVITY_SCHEME"
ElseConstructReference = "ELSE"
ExternalURLReference = "HAS_EXTERNAL_URL"
GeographicLocationSchemeReference = "IN_GEOGRAPHIC_LOCATION_SCHEME"
GeographicStructureSchemeReference = "IN_GEOGRAPHIC_STRUCTURE_SCHEME"
IndividualReference = "REFERENCES_INDIVIDUAL"
InstructionReference = "HAS_INSTRUCTION"
InstrumentReference = "USES_INSTRUMENT"
InstrumentSchemeReference = "IN_INSTRUMENT_SCHEME"
InterviewerInstructionReference = "HAS_INSTRUCTION"
InterviewerInstructionSchemeReference = "IN_INSTRUCTION_SCHEME"
LoopVariableReference = "LOOP_VARIABLE"
ManagedRepresentationReference = "HAS_REPRESENTATION"
MeasurementItemReference = "USES_MEASUREMENT"
MeasurementReference = "USES_MEASUREMENT"
MeasurementSchemeReference = "IN_MEASUREMENT_SCHEME"
MethodologyReference = "USES_METHODOLOGY"
NCubeSchemeReference = "IN_NCUBE_SCHEME"
OrganizationReference = "REFERENCES_ORGANIZATION"
PhysicalInstanceReference = "HAS_PHYSICAL_INSTANCE"
ProcessingEventSchemeReference = "IN_PROCESSING_EVENT_SCHEME"
ProcessingInstructionSchemeReference = "IN_PROCESSING_INSTRUCTION_SCHEME"
QuestionBlockReference = "ASKS_QUESTION"
QuestionGridReference = "ASKS_QUESTION"
QuestionItemReference = "ASKS_QUESTION"
QuestionReference = "REFERENCES_QUESTION"
QuestionSchemeReference = "IN_QUESTION_SCHEME"
RelatedOtherMaterialReference = "HAS_RELATED_MATERIAL"
RepresentedVariableGroupReference = "IN_REPRESENTED_VARIABLE_GROUP"
RepresentedVariableReference = "USES_REPRESENTED_VARIABLE"
RepresentedVariableSchemeReference = "HAS_REPRESENTED_VARIABLE_SCHEME"
ResourcePackageReference = "USES_RESOURCE_PACKAGE"
SamplingInformationSchemeReference = "IN_SAMPLING_INFORMATION_SCHEME"
SourceParameterReference = "SOURCE_PARAM"
StatisticalClassificationReference = "USES_STATISTICAL_CLASSIFICATION"
TargetParameterReference = "TARGET_PARAM"
ThenConstructReference = "THEN"
UnitTypeSchemeReference = "IN_UNIT_TYPE_SCHEME"
UniverseReference = "IN_UNIVERSE"
UniverseSchemeReference = "IN_UNIVERSE_SCHEME"
UntilConstructReference = "UNTIL"
ValueRepresentationReference = "HAS_VALUE_REPRESENTATION"
VariableReference = "REFERENCES_VARIABLE"
VariableSchemeReference = "IN_VARIABLE_SCHEME"
VariableUsedReference = "USES_VARIABLE"
WhileConstructReference = "WHILE"

name: Publish

on:
  release:
    types: [published]
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14.4"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs]

      - name: Validate bundled schemas
        run: python scripts/update_schemas.py --check

      - name: Validate generated schema definitions
        run: python scripts/generate_schema_definitions.py --check

      - name: XSD structural relationship coverage (blocking, 100%)
        run: python scripts/xsd_coverage.py --structural --structural-threshold 100

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Markdownlint
        if: matrix.python-version == '3.12'
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "!**/site-packages/**" "!**/.venv/**"

      - name: Mypy
        run: mypy .

      - name: Pytest + coverage
        run: pytest --cov=ddigraph --cov-report=term-missing --cov-report=xml
        timeout-minutes: 5

      - name: Readability gate (docs/en Grade-10)
        if: matrix.python-version == '3.12'
        run: python scripts/check_readability.py docs/en --threshold 10 --fail-on-error

      - name: Build docs
        if: matrix.python-version == '3.12'
        run: mkdocs build --strict

  detect-release:
    name: Detect version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compare pyproject version to existing tags
        id: check
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "Tag v${version} already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No tag v${version}; release will run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  dry-run:
    name: Build (dry-run)
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build hatch twine pyroma check-manifest

      - name: Build artifacts
        run: |
          rm -rf dist
          hatch build

      - name: twine check (PyPI metadata)
        run: twine check dist/*

      - name: pyroma audit
        run: pyroma -d .

      - name: check-manifest
        run: check-manifest

  publish:
    name: Publish to PyPI
    # Triggers: GitHub release, pushed v* tag, or a push to main where the
    # pyproject version doesn't yet have a matching tag. `always()` lets us
    # ignore detect-release on the non-main triggers where it's skipped.
    if: |
      always() && needs.tests.result == 'success' && (
        github.event_name == 'release'
        || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-release.result == 'success' && needs.detect-release.outputs.should_release == 'true')
      )
    needs: [tests, detect-release]
    runs-on: ubuntu-latest
    # OIDC ("Trusted Publishing") replaces the long-lived PYPI_TOKEN
    # secret. Requires a one-time configuration on PyPI:
    # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    environment:
      name: pypi
      url: https://pypi.org/project/ddigraph/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build artifacts
        run: |
          rm -rf dist
          hatch build

      - name: Publish package via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.0

      - name: Tag release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

  docs:
    name: Deploy docs
    if: github.event_name == 'release'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

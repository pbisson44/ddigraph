name: Publish

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14.4"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,docs]

      - name: Validate bundled schemas
        run: python scripts/update_schemas.py --check

      - name: Validate generated schema definitions
        run: python scripts/generate_schema_definitions.py --check

      - name: XSD structural relationship coverage (blocking, 100%)
        run: python scripts/xsd_coverage.py --structural --structural-threshold 100

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Markdownlint
        if: matrix.python-version == '3.12'
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md" "!**/site-packages/**" "!**/.venv/**"

      - name: Mypy
        run: mypy .

      - name: Pytest + coverage
        run: pytest --cov=ddigraph --cov-report=term-missing --cov-report=xml
        timeout-minutes: 5

      - name: Readability gate (docs/en Grade-10)
        if: matrix.python-version == '3.12'
        run: python scripts/check_readability.py docs/en --threshold 10 --fail-on-error

      - name: Build docs
        if: matrix.python-version == '3.12'
        run: mkdocs build --strict

  dry-run:
    name: Build (dry-run)
    if: github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build hatch twine pyroma check-manifest

      - name: Build artifacts
        run: |
          rm -rf dist
          hatch build

      - name: twine check (PyPI metadata)
        run: twine check dist/*

      - name: pyroma audit
        run: pyroma -d .

      - name: check-manifest
        run: check-manifest

  publish:
    name: Publish to PyPI
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    # OIDC ("Trusted Publishing") replaces the long-lived PYPI_TOKEN
    # secret. Requires a one-time configuration on PyPI:
    # https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    environment:
      name: pypi
      url: https://pypi.org/project/ddigraph/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build artifacts
        run: |
          rm -rf dist
          hatch build

      - name: Publish package via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.0

  docs:
    name: Deploy docs
    if: github.event_name == 'release'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Fira Code
  language: en

extra_css:
  - stylesheets/extra.css

extra:
  alternate:
    - name: English
      link: /ddigraph/
      lang: en
    - name: Français
      link: /ddigraph/fr/
      lang: fr
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pbisson44/ddigraph
      name: ddigraph on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ddigraph/
      name: ddigraph on PyPI
    - icon: material/coffee
      link: https://buymeacoffee.com/pbisson44
      name: Buy me a coffee

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.details
  # Lets the changelog pages include the real CHANGELOG.md instead of
  # duplicating it. The hand-maintained copies had drifted to the point of
  # stopping at v0.1.0, with no 0.4.x content at all.
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji
  - pymdownx.tasklist
  - tables
  - attr_list
  - md_in_html

hooks:
  - hooks/copy_sitemap.py
  
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
